name: Update economic calendar
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch this week's calendar
        run: |
          curl -fsSL -A "Mozilla/5.0" https://nfs.faireconomy.media/ff_calendar_thisweek.json -o ff.json
          node -e "const e=require('./ff.json');if(!Array.isArray(e)||!e.length)process.exit(1);require('fs').writeFileSync('calendar.json',JSON.stringify({updated:new Date().toISOString(),events:e}))"
          rm ff.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --cached --quiet || git commit -m "Update economic calendar"
          git push
